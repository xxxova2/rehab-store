name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, build (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [apps/web, apps/medusa, packages/tokens, packages/ui, packages/three, packages/types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Typecheck ${{ matrix.workspace }}
        run: npm run typecheck --workspace=${{ matrix.workspace }} || true

  e2e:
    name: Playwright E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build web app
        run: npm run build --workspace=@rehab/web
      - name: Run E2E
        run: npx playwright test --project=chromium --project=firefox --project=webkit
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e]
    # Only deploy on push to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Deploy to Vercel
        # Requires these GitHub secrets:
        #   VERCEL_TOKEN     — Create at https://vercel.com/account/tokens
        #   VERCEL_ORG_ID    — team_o7E8Ah6Cz9kMBYFuMbW6FaFM
        #   VERCEL_PROJECT_ID — prj_H7VzGRyH0p2MzkMXnB7jU7kBxLwD
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
