version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rehab-postgres
    environment:
      POSTGRES_USER: rehab
      POSTGRES_PASSWORD: rehab
      POSTGRES_DB: rehab
    ports:
      - '5432:5432'
    volumes:
      - rehab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rehab -d rehab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rehab-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rehab_pg:
